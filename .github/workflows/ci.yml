name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Android platform 37 (the runner already has the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" || true
      - name: Unit tests, JS tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest testHubJs lintDebug assembleDebug
      - name: Ad-block list builder tests
        run: python3 tools/test_build_adblock.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dailies-debug
          path: app/build/outputs/apk/debug/*.apk
