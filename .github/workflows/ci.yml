name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (caches the Gradle download between runs)
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch the Gradle wrapper (retries when the download server is busy)
        run: for i in 1 2 3 4 5 6; do ./gradlew --no-daemon --version > /dev/null && exit 0; echo "Gradle download failed, retrying in $((i * 20))s"; sleep $((i * 20)); done; exit 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Android platform 37 (the runner already has the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" || true
      - name: Unit tests, JS tests, lint and debug build
        run: ./gradlew --no-daemon testDebugUnitTest testHubJs lintDebug assembleDebug
      - name: Ad-block list builder tests
        run: python3 tools/test_build_adblock.py
      - uses: actions/upload-artifact@v4
        with:
          name: Dailies-debug
          path: app/build/outputs/apk/debug/*.apk

  # On-device smoke tests: the hub page and its bridge, light theme, the alert-channel migration.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (caches the Gradle download between runs)
        uses: gradle/actions/setup-gradle@v4
      - name: Fetch the Gradle wrapper (retries when the download server is busy)
        run: for i in 1 2 3 4 5 6; do ./gradlew --no-daemon --version > /dev/null && exit 0; echo "Gradle download failed, retrying in $((i * 20))s"; sleep $((i * 20)); done; exit 1
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install Android platform 37
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" || true
      - name: Build the app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Run on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # On failure, print the crash buffer and any fatal exception before the emulator shuts down.
          script: >-
            ./gradlew --no-daemon connectedDebugAndroidTest || { adb logcat -d -b crash | tail -n 120; adb logcat -d | grep -E -A40 "FATAL EXCEPTION|Process. com.dailygames" | head -n 200; adb logcat -d | grep -iE "com.dailygames.hub" | grep -iE "kill|died|force.stop|crash|changed" | tail -n 60; exit 1; }
      - name: Show failing device tests
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for bad in list(tc.findall('failure')) + list(tc.findall('error')):
                      print(f"::error title={tc.get('classname')}.{tc.get('name')}::" + (bad.get('message') or '')[:300].replace('\n', ' '))
                      print((bad.text or '')[:3000])
          PY
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: device-test-reports
          path: app/build/reports/androidTests/
