name: Web app

# Publishes the Dailies web app (the hub from app/src/main/assets + web/) to GitHub Pages.
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/assets/index.html'
      - 'app/src/main/assets/app.css'
      - 'app/src/main/assets/hub-core.js'
      - 'app/src/main/assets/known-games.js'
      - 'app/src/main/assets/fonts/**'
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Build the web app
        run: node web/build.mjs dist-web
      - name: Check the build
        run: node web/check-build.mjs dist-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
