name: Release

# Push a tag such as v1.4.0 to build a signed APK and publish it as a GitHub release.
# Needs these repository secrets (Settings → Secrets and variables → Actions), which
# scripts/publish-to-github.* can set for you:
#   RELEASE_KEYSTORE_BASE64  base64 of dailies-release.jks
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
on:
  push:
    tags: ['v*']
  # Or run it by hand: Actions → Release → Run workflow, and enter the version tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create, e.g. v1.4.0 (must match versionName in app/build.gradle.kts)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check the tag matches versionName
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION_NAME="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -1)"
          if [ -z "$VERSION_NAME" ]; then echo "::error::Could not read versionName from app/build.gradle.kts"; exit 1; fi
          if [ "${TAG#v}" != "$VERSION_NAME" ]; then
            echo "::error::Tag $TAG does not match versionName $VERSION_NAME in app/build.gradle.kts (bump versionName and versionCode first)"
            exit 1
          fi
          HUB_VERSION="$(sed -nE "s/^[[:space:]]*const APP_VERSION = '([^']+)';.*/\1/p" app/src/main/assets/index.html | head -1)"
          if [ "$HUB_VERSION" != "$VERSION_NAME" ]; then
            echo "::error::APP_VERSION in app/src/main/assets/index.html is '$HUB_VERSION', expected $VERSION_NAME"
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle (caches the Gradle download between runs)
        uses: gradle/actions/setup-gradle@v4
      - name: Pick Gradle (the runner's own copy when it matches the wrapper, so nothing is downloaded)
        run: |
          want="$(sed -n 's/.*gradle-\([0-9.]*\)-bin\.zip.*/\1/p' gradle/wrapper/gradle-wrapper.properties)"
          if command -v gradle > /dev/null && gradle --version 2> /dev/null | grep -q "^Gradle $want\$"; then
            echo "Using the runner's Gradle $want"; echo "GRADLE=gradle" >> "$GITHUB_ENV"
          else
            echo "GRADLE=./gradlew" >> "$GITHUB_ENV"
            for i in 1 2 3 4 5 6; do ./gradlew --no-daemon --version > /dev/null && exit 0; echo "Gradle download failed, retrying in $((i * 20))s"; sleep $((i * 20)); done; exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Install Android platform 37 (the runner already has the Android SDK)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0" || true
      - name: Restore signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build signed APK
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: $GRADLE --no-daemon testDebugUnitTest testHubJs assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          cp app/build/outputs/apk/release/Dailies-release.apk "Dailies-$VERSION.apk"
          # Only this version's notes: RELEASE_NOTES.md up to the first "---" separator.
          NOTES="$RUNNER_TEMP/notes.md"
          if [ -f RELEASE_NOTES.md ]; then awk '/^---$/{exit} {print}' RELEASE_NOTES.md > "$NOTES"; else : > "$NOTES"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "Dailies-$VERSION.apk" --clobber
          else
            gh release create "$TAG" "Dailies-$VERSION.apk" --title "Dailies $VERSION" --notes-file "$NOTES" --target "$GITHUB_SHA" --latest
          fi
          rm -f "$RUNNER_TEMP/release.jks"
